<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CRM para Cafetería Oveja Negra — Gestión integral de clientes, productos, ventas, reservaciones, promociones, proveedores e inventario.">
  <title>Oveja Negra CRM — Cafetería</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>

  <!-- EmailJS SDK (Client-side email delivery) -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicon -->
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <!-- Auth Screen Container (Login / Register / Verify) -->
  <div id="auth-container" class="auth-container" style="display: none;"></div>

  <div class="app-layout">
    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="assets/logo.svg" alt="Oveja Negra" class="sidebar-logo">
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Principal</div>
          <a class="nav-item active" data-module="dashboard" href="#dashboard">
            <i data-lucide="layout-dashboard" width="20" height="20"></i>
            Dashboard
          </a>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">Gestión</div>
          <a class="nav-item" data-module="clientes" href="#clientes">
            <i data-lucide="users" width="20" height="20"></i>
            Clientes
          </a>
          <a class="nav-item" data-module="productos" href="#productos">
            <i data-lucide="coffee" width="20" height="20"></i>
            Productos
          </a>
          <a class="nav-item" data-module="ventas" href="#ventas">
            <i data-lucide="shopping-bag" width="20" height="20"></i>
            Ventas
          </a>
          <a class="nav-item" data-module="reservaciones" href="#reservaciones">
            <i data-lucide="calendar-check" width="20" height="20"></i>
            Reservaciones
          </a>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">Administración</div>
          <a class="nav-item" data-module="promociones" href="#promociones">
            <i data-lucide="tag" width="20" height="20"></i>
            Promociones
          </a>
          <a class="nav-item" data-module="proveedores" href="#proveedores">
            <i data-lucide="truck" width="20" height="20"></i>
            Proveedores
          </a>
          <a class="nav-item" data-module="inventario" href="#inventario">
            <i data-lucide="package" width="20" height="20"></i>
            Inventario
            <span class="nav-badge" id="stock-badge" style="display: none;">0</span>
          </a>
          <a class="nav-item" data-module="usuarios" href="#usuarios" id="nav-item-usuarios">
            <i data-lucide="shield-check" width="20" height="20"></i>
            Usuarios y Roles
            <span class="nav-badge" id="pending-users-badge" style="display: none; background: #EF6C00; color: white;">0</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <p>Oveja Negra CRM v1.0</p>
        <p>© 2026</p>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Header -->
      <header class="app-header">
        <div class="header-left">
          <button class="menu-toggle" id="menu-toggle">
            <i data-lucide="menu" width="24" height="24"></i>
          </button>
          <div class="header-search">
            <i data-lucide="search" width="16" height="16"></i>
            <input type="text" id="global-search" placeholder="Buscar clientes, productos...">
          </div>
        </div>
        <div class="header-right">
          <span class="header-date" id="header-date"></span>
          <button class="header-btn" title="Notificaciones de Inventario" onclick="window.location.hash='inventario'">
            <i data-lucide="bell" width="20" height="20"></i>
            <span class="notification-dot" id="notification-dot" style="display: none;"></span>
          </button>
          
          <!-- User Profile & Logout -->
          <div class="header-user-profile" id="header-user-profile">
            <div class="header-avatar" id="header-user-avatar">AD</div>
            <div class="header-user-details">
              <span class="header-user-name" id="header-user-name">Usuario</span>
              <span class="header-user-role" id="header-user-role">Rol</span>
            </div>
            <button class="header-logout-btn" onclick="Auth.logout()" title="Cerrar Sesión">
              <i data-lucide="log-out" width="16" height="16"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Dynamic Page Content -->
      <div class="page-content" id="page-content">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>

  <!-- JavaScript Modules -->
  <script src="js/db.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/clientes.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/ventas.js"></script>
  <script src="js/reservaciones.js"></script>
  <script src="js/promociones.js"></script>
  <script src="js/proveedores.js"></script>
  <script src="js/inventario.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
